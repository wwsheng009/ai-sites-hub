# ai-sites-client 配置样例
# 复制为 config.yaml 后修改；所有键可用环境变量覆盖：AISC_ 前缀 + 下划线路径（AISC_SERVER_ADDR）

server:
  addr: ":8080"          # HTTP 监听地址
  base_path: ""          # 反向代理子路径（可选）

security:
  # 凭据 AES-256-GCM 主密钥（32 字节）：
  #  - 生成：openssl rand -base64 32
  #  - 生产环境必须用环境变量 AISC_SECURITY_MASTER_KEY 注入，勿写入本文件
  master_key: ""

database:
  path: "data/aiclient.db"   # SQLite 文件位置（目录自动创建）

log:
  level: "info"          # debug | info | warn | error
  format: "console"      # console | json

jobs:
  enabled: false         # 后台作业总开关（M2 骨架默认关；M4 接入后开启）
  dry_run_default: true  # 作业安全默认：不外呼，只记录
