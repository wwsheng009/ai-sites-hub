# ai-sites-hub 配置样例
# 复制为 config.yaml 后修改；config.local.yaml（gitignored，优先级最高）适合放本地密钥。
# 所有键可用环境变量覆盖：AISC_ 前缀 + 下划线路径（AISC_SERVER_ADDR）

server:
  addr: ":8080"          # HTTP 监听地址
  base_path: ""          # 反向代理子路径（可选）

security:
  # 凭据 AES-256-GCM 主密钥（必须是 32 字节原文，不是 base64）：
  #  - 生成：python -c "import secrets;print(secrets.token_urlsafe(24))"   # 恰好 32 字符
  #  - 生产环境必须用环境变量 AISC_SECURITY_MASTER_KEY 注入，勿写入本文件
  #  - 不配置时服务可启动，但凭据写入/登录测试不可用（doctor 报 fail）
  master_key: ""

database:
  path: "data/aiclient.db"   # SQLite 文件位置（目录自动创建）
  auto_migrate: true         # 启动时自动应用 migrations/*.sql（默认 true；设为 false 需手动运行 `aiclient migrate`）

log:
  level: "info"          # debug | info | warn | error
  format: "console"      # console | json

jobs:
  enabled: false         # 后台作业总开关（M2 骨架默认关；M4 接入后开启）
  dry_run_default: true  # 作业安全默认：不外呼，只记录

proxy:
  # 全局出站代理（站点级 proxy_url 优先；均空则直连）。
  # 支持 http/https/socks5，如 http://127.0.0.1:7890、socks5://user:pass@127.0.0.1:1080
  # （socks5h 域名由代理解析）。环境变量覆盖：AISC_PROXY_URL
  url: ""
